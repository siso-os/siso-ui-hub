<!doctype html><meta charset="utf-8"><title>Rob board</title>
<style>
:root{--bg:#0c0c0e;--panel:#151518;--line:#26262b;--fg:#e8e8ec;--mute:#8b8b95;--acc:#ff5c9a;--yes:#6ee7a8;--no:#ff6a6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(12,12,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12px}
.chip.on{color:var(--fg);border-color:var(--acc);background:#2a1620}
.lvl{margin-left:auto;display:flex;gap:6px}
.ask{padding:12px 16px 0;color:#c9c9d2;font-size:13px;max-width:980px}
.ask b{color:var(--fg)}
main{padding:12px 16px 40px;display:grid;gap:18px}
h2{font-size:13px;margin:6px 0 0;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#0f0f12;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.yes{border-color:var(--yes);box-shadow:0 0 0 1px var(--yes) inset}.card.no{opacity:.45}
.img{aspect-ratio:16/10;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;position:relative}
.img img{width:100%;height:100%;object-fit:contain;object-position:top}
.img iframe{position:absolute;top:0;left:0;width:1440px;height:900px;transform-origin:0 0;border:0;pointer-events:none;background:#fff}
.img.wide{aspect-ratio:16/9}
.body{padding:9px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.t b{font-size:13px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.d{color:#b9b9c4;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;margin-top:auto;align-items:center;flex-wrap:wrap}
.acts button,.acts a{font-size:11.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:#17171b;color:var(--fg);cursor:pointer;text-decoration:none}
.acts button.y.on{border-color:var(--yes);color:var(--yes)}.acts button.n.on{border-color:var(--no);color:var(--no)}
.note{width:100%;background:#111114;border:1px solid var(--line);color:var(--fg);padding:5px 8px;border-radius:7px;font-size:12px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:94vh;object-fit:contain}#zoom iframe{width:94vw;height:92vh;border:0;background:#fff;border-radius:10px}
.count{color:var(--mute);font-size:12px}.empty{color:var(--mute);font-size:13px;padding:10px 0}
.picked{font-size:12px;color:var(--yes)}
</style>
<header><h1>Rob board</h1><span id="surfaces"></span><span class="lvl" id="levels"></span><span class="count" id="count"></span></header>
<div class="ask" id="ask"></div>
<main id="main"></main>
<div id="zoom"></div>
<script>
let M={surfaces:[]},votes={},sid=new URLSearchParams(location.search).get('s')||'sessions',lvl=new URLSearchParams(location.search).get('l')||'1',corpus={}
const $=s=>document.querySelector(s)
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){[M,votes]=await Promise.all([fetch('/api/rob/surfaces').then(r=>r.json()),fetch('/api/rob/votes').then(r=>r.json()).catch(()=>({}))]);renderHeader();await show()}
const save=()=>fetch('/api/rob/votes',{method:'POST',body:JSON.stringify(votes,null,1)})
function renderHeader(){
  $('#surfaces').innerHTML=M.surfaces.map(s=>{const n=Object.values(votes[s.id]||{}).filter(v=>v.pick==='yes').length;return `<span class="chip ${s.id===sid?'on':''}" data-s="${s.id}">${esc(s.title)}${n?` <span class="picked">✓${n}</span>`:''}</span>`}).join('')
  $('#levels').innerHTML=[['1','21st corpus'],['2','shadcn'],['3','GitHub repos']].map(([k,t])=>`<span class="chip ${k===lvl?'on':''}" data-l="${k}">${t}</span>`).join('')
  document.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{sid=c.dataset.s;history.replaceState(null,'',`?s=${sid}&l=${lvl}`);renderHeader();show()})
  document.querySelectorAll('[data-l]').forEach(c=>c.onclick=()=>{lvl=c.dataset.l;history.replaceState(null,'',`?s=${sid}&l=${lvl}`);renderHeader();show()})
}
async function show(){
  const s=M.surfaces.find(x=>x.id===sid);$('#ask').innerHTML=`<b>${esc(s.title)}</b> — ${esc(s.ask)}`
  if(lvl==='1'){corpus[sid]??=await fetch(`/api/rob/corpus/${sid}`).then(r=>r.json());const rows=corpus[sid];$('#count').textContent=`${rows.length} comps`
    $('#main').innerHTML=`<h2>21st.dev corpus · lanes ${s.level1.lanes.join(', ')} · local previews</h2><div class="cards">${rows.map(r=>card({key:r.url,img:`/harvest/${r.id}/preview.webp`,name:r.name,by:'@'+r.author,desc:r.desc,tags:[`${r.usage||0} installs`,r.lane],links:[[r.url,'21st ↗'],[`/harvest/${r.id}/bundle.html`,'bundle']]})).join('')}</div>`}
  if(lvl==='2'){const b=s.level2.blocks,c=s.level2.components;$('#count').textContent=`${b.length} blocks · ${c.length} components`
    $('#main').innerHTML=`<h2>shadcn blocks · live from ui.shadcn.com</h2>${b.length?`<div class="cards">${b.map(n=>card({key:`shadcn:block:${n}`,iframe:`https://ui.shadcn.com/view/new-york-v4/${n}`,name:n,by:'shadcn',desc:'official block',tags:['block'],links:[[`https://ui.shadcn.com/blocks`,'blocks ↗'],[`https://ui.shadcn.com/view/new-york-v4/${n}`,'open view']]})).join('')}</div>`:'<div class="empty">no whole-page block fits; see components</div>'}
    <h2>shadcn components · docs</h2><div class="cards">${c.map(n=>card({key:`shadcn:ui:${n}`,iframe:`https://ui.shadcn.com/docs/components/radix/${n}`,name:n,by:'shadcn',desc:'official component',tags:['component'],links:[[`https://ui.shadcn.com/docs/components/radix/${n}`,'docs ↗']]})).join('')}</div>`}
  if(lvl==='3'){const g=s.level3||[];$('#count').textContent=`${g.length} repos`
    $('#main').innerHTML=`<h2>GitHub repos · whole surfaces to lift</h2>${g.length?`<div class="cards">${g.map(r=>card({key:r.url,noframe:r.noframe,iframe:r.demo,img:r.image,name:r.name,by:r.license||'',desc:`${r.rob||''} — ${r.why||''}${r.risk?` · risk: ${r.risk}`:''}`,tags:[r.stack||''].filter(Boolean),links:[[r.url,'repo ↗'],...(r.demo?[[r.demo,'demo ↗']]:[])]})).join('')}</div>`:'<div class="empty">scouts still out — this fills when they report</div>'}`}
  wireCards();fitFrames()
}
function fitFrames(){document.querySelectorAll('.img iframe').forEach(f=>{const w=f.parentElement.clientWidth;f.style.transform=`scale(${w/1440})`})}
window.addEventListener('resize',fitFrames)
function card(o){const v=(votes[sid]||{})[o.key]||{};const media=o.noframe?`<div class="img wide" style="cursor:default;color:var(--mute);font-size:12px">site refuses embedding — open demo ↗</div>`:o.iframe?`<div class="img wide" data-zoom="${esc(o.iframe)}" data-kind="iframe"><iframe loading="lazy" src="${esc(o.iframe)}"></iframe></div>`:`<div class="img" data-zoom="${esc(o.img)}" data-kind="img"><img loading="lazy" src="${esc(o.img)}" alt=""></div>`
  return `<div class="card ${v.pick||''}" data-key="${esc(o.key)}">${media}<div class="body"><div class="t"><b>${esc(o.name)}</b><span class="tag">${esc(o.by)}</span>${o.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="d">${esc(o.desc)}</div>
  <div class="acts"><button class="y ${v.pick==='yes'?'on':''}" data-pick="yes">✓ rob this</button><button class="n ${v.pick==='no'?'on':''}" data-pick="no">✕ no</button>${o.links.map(([h,t])=>`<a href="${esc(h)}" target="_blank">${t}</a>`).join('')}</div>
  <input class="note" placeholder="what to take / bend…" value="${esc(v.note||'')}"></div></div>`}
function wireCards(){
  document.querySelectorAll('.card').forEach(c=>{const key=c.dataset.key
    c.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const cur=(votes[sid]??={})[key]||{};votes[sid][key]={...cur,pick:cur.pick===b.dataset.pick?null:b.dataset.pick,at:new Date().toISOString()};save();renderHeader();c.className='card '+(votes[sid][key].pick||'');c.querySelectorAll('[data-pick]').forEach(x=>x.classList.toggle('on',votes[sid][key].pick===x.dataset.pick))})
    c.querySelector('.note').onchange=e=>{(votes[sid]??={})[key]={...(votes[sid][key]||{}),note:e.target.value,at:new Date().toISOString()};save()}
    c.querySelector('.img').onclick=()=>{if(!c.querySelector('.img').dataset.kind)return;const z=$('#zoom');z.innerHTML=c.querySelector('.img').dataset.kind==='iframe'?`<iframe src="${c.querySelector('.img').dataset.zoom}"></iframe>`:`<img src="${c.querySelector('.img').dataset.zoom}">`;z.style.display='flex'}})
}
$('#zoom').onclick=e=>{if(e.target.id==='zoom'){$('#zoom').style.display='none';$('#zoom').innerHTML=''}}
load()
</script>
