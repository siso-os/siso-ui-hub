# Deploy (from app/): heavy -- npm run build && npx wrangler deploy -c worker/wrangler.toml
# Secrets: HUB_PASSWORD (the estate world's password, from .credentials; never printed). KV: BOOKMARKS.
name = "siso-ui-hub"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = "a955406e85b517fd5891b498f6e1643f"
workers_dev = true

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[kv_namespaces]]
binding = "BOOKMARKS"
id = "58d068dda8c0466bbf29ee64d38fba27"
